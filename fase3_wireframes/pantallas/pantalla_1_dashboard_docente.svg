<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" style="background-color: #f4f6f8; font-family: Arial, sans-serif;">
  <!-- Header Moodle -->
  <rect x="0" y="0" width="1200" height="60" fill="#1e293b"/>
  <text x="30" y="37" fill="#ffffff" font-size="18" font-weight="bold">Universidad de Cuenca | eVirtual</text>
  <text x="920" y="37" fill="#cbd5e1" font-size="14">Docente: Xavier Pena | Ciencia de Datos</text>

  <!-- Sub-header -->
  <rect x="0" y="60" width="1200" height="50" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="30" y="92" fill="#0f172a" font-size="16" font-weight="bold">CheckBefore - Panel de Preparacion Previa (Paralelo 1)</text>

  <!-- Metric Cards -->
  <!-- Card 1 -->
  <rect x="30" y="130" width="360" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="50" y="160" fill="#64748b" font-size="13" font-weight="bold">IPP PROMEDIO DEL CURSO</text>
  <text x="50" y="200" fill="#0f172a" font-size="32" font-weight="bold">68.5%</text>
  <text x="180" y="198" fill="#16a34a" font-size="12">+4.2% vs. tarea anterior</text>

  <!-- Card 2 -->
  <rect x="420" y="130" width="360" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="440" y="160" fill="#64748b" font-size="13" font-weight="bold">ESTUDIANTES EN RIESGO (NIVEL ROJO)</text>
  <text x="440" y="200" fill="#dc2626" font-size="32" font-weight="bold">5 Alumnos</text>
  <text x="610" y="198" fill="#64748b" font-size="12">(12.5% del paralelo)</text>

  <!-- Card 3 -->
  <rect x="810" y="130" width="360" height="100" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="830" y="160" fill="#64748b" font-size="13" font-weight="bold">PROXIMO CIERRE (VENTANA 48H)</text>
  <text x="830" y="195" fill="#0f172a" font-size="18" font-weight="bold">Tarea 2: Ejercicios Algebra</text>
  <text x="830" y="215" fill="#d97706" font-size="13" font-weight="bold">Faltan 42h para el limite</text>

  <!-- Main Section -->
  <rect x="30" y="250" width="1140" height="510" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Section Title -->
  <text x="60" y="290" fill="#0f172a" font-size="18" font-weight="bold">Estado de Preparacion del Paralelo - Tarea 2</text>
  <rect x="910" y="265" width="230" height="40" rx="6" fill="#dc2626"/>
  <text x="925" y="290" fill="#ffffff" font-size="13" font-weight="bold">Intervenir Grupo en Riesgo (Rojo)</text>

  <!-- Summary Box (Left) -->
  <rect x="60" y="320" width="300" height="410" fill="#f8fafc" stroke="#e2e8f0" rx="6"/>
  <text x="80" y="355" fill="#0f172a" font-size="15" font-weight="bold">Distribucion del Semaforo</text>
  
  <text x="80" y="395" fill="#334155" font-size="13" font-weight="bold">Nivel Verde (70%)</text>
  <rect x="80" y="405" width="260" height="16" rx="4" fill="#e2e8f0"/>
  <rect x="80" y="405" width="182" height="16" rx="4" fill="#16a34a"/>
  <text x="80" y="437" fill="#64748b" font-size="12">28 Estudiantes (IPP >= 70%)</text>

  <text x="80" y="480" fill="#334155" font-size="13" font-weight="bold">Nivel Amarillo (17.5%)</text>
  <rect x="80" y="490" width="260" height="16" rx="4" fill="#e2e8f0"/>
  <rect x="80" y="490" width="45" height="16" rx="4" fill="#ca8a04"/>
  <text x="80" y="522" fill="#64748b" font-size="12">7 Estudiantes (40% &lt;= IPP &lt; 70%)</text>

  <text x="80" y="565" fill="#334155" font-size="13" font-weight="bold">Nivel Rojo (12.5%)</text>
  <rect x="80" y="575" width="260" height="16" rx="4" fill="#e2e8f0"/>
  <rect x="80" y="575" width="33" height="16" rx="4" fill="#dc2626"/>
  <text x="80" y="607" fill="#dc2626" font-size="12" font-weight="bold">5 Estudiantes (IPP &lt; 40%)</text>

  <rect x="80" y="640" width="260" height="65" rx="6" fill="#fef2f2" stroke="#fecaca"/>
  <text x="95" y="663" fill="#991b1b" font-size="12" font-weight="bold">Atencion Recomendada:</text>
  <text x="95" y="685" fill="#7f1d1d" font-size="11">5 alumnos aun no leen la Guia T3.</text>

  <!-- Data Table (Right) -->
  <rect x="380" y="320" width="760" height="410" fill="#ffffff" stroke="#e2e8f0" rx="4"/>
  <!-- Table Header -->
  <rect x="380" y="320" width="760" height="40" fill="#f8fafc"/>
  <text x="400" y="345" fill="#475569" font-size="12" font-weight="bold">ESTUDIANTE</text>
  <text x="600" y="345" fill="#475569" font-size="12" font-weight="bold">RECURSOS (D02/D01)</text>
  <text x="760" y="345" fill="#475569" font-size="12" font-weight="bold">IPP (D03)</text>
  <text x="870" y="345" fill="#475569" font-size="12" font-weight="bold">SEMAFORO (D04)</text>
  <text x="1020" y="345" fill="#475569" font-size="12" font-weight="bold">ACCION</text>

  <!-- Row 1 -->
  <line x1="380" y1="360" x2="1140" y2="360" stroke="#f1f5f9"/>
  <text x="400" y="390" fill="#0f172a" font-size="13">Carlos Perez</text>
  <text x="600" y="390" fill="#334155" font-size="13">1 / 4 Consultados</text>
  <text x="760" y="390" fill="#dc2626" font-size="13" font-weight="bold">25.0%</text>
  <rect x="870" y="375" width="90" height="22" rx="11" fill="#fef2f2"/>
  <text x="890" y="390" fill="#991b1b" font-size="11" font-weight="bold">Nivel Rojo</text>
  <rect x="1010" y="373" width="90" height="26" rx="4" fill="#ef4444"/>
  <text x="1025" y="390" fill="#ffffff" font-size="11" font-weight="bold">Intervenir</text>

  <!-- Row 2 -->
  <line x1="380" y1="415" x2="1140" y2="415" stroke="#f1f5f9"/>
  <text x="400" y="445" fill="#0f172a" font-size="13">Maria Lopez</text>
  <text x="600" y="445" fill="#334155" font-size="13">1 / 4 Consultados</text>
  <text x="760" y="445" fill="#dc2626" font-size="13" font-weight="bold">25.0%</text>
  <rect x="870" y="430" width="90" height="22" rx="11" fill="#fef2f2"/>
  <text x="890" y="445" fill="#991b1b" font-size="11" font-weight="bold">Nivel Rojo</text>
  <rect x="1010" y="428" width="90" height="26" rx="4" fill="#ef4444"/>
  <text x="1025" y="445" fill="#ffffff" font-size="11" font-weight="bold">Intervenir</text>

  <!-- Row 3 -->
  <line x1="380" y1="470" x2="1140" y2="470" stroke="#f1f5f9"/>
  <text x="400" y="500" fill="#0f172a" font-size="13">Juan Gomez</text>
  <text x="600" y="500" fill="#334155" font-size="13">2 / 4 Consultados</text>
  <text x="760" y="500" fill="#ca8a04" font-size="13" font-weight="bold">50.0%</text>
  <rect x="870" y="485" width="105" height="22" rx="11" fill="#fefce8"/>
  <text x="882" y="500" fill="#854d0e" font-size="11" font-weight="bold">Nivel Amarillo</text>
  <rect x="1010" y="483" width="90" height="26" rx="4" fill="#cbd5e1"/>
  <text x="1025" y="500" fill="#334155" font-size="11">Ver Detalle</text>

  <!-- Row 4 -->
  <line x1="380" y1="525" x2="1140" y2="525" stroke="#f1f5f9"/>
  <text x="400" y="555" fill="#0f172a" font-size="13">Ana Martinez</text>
  <text x="600" y="555" fill="#334155" font-size="13">4 / 4 Consultados</text>
  <text x="760" y="555" fill="#16a34a" font-size="13" font-weight="bold">100.0%</text>
  <rect x="870" y="540" width="90" height="22" rx="11" fill="#f0fdf4"/>
  <text x="888" y="555" fill="#166534" font-size="11" font-weight="bold">Nivel Verde</text>
  <rect x="1010" y="538" width="90" height="26" rx="4" fill="#cbd5e1"/>
  <text x="1025" y="555" fill="#334155" font-size="11">Ver Detalle</text>

  <!-- Row 5 -->
  <line x1="380" y1="580" x2="1140" y2="580" stroke="#f1f5f9"/>
  <text x="400" y="610" fill="#0f172a" font-size="13">Luis Fernandez</text>
  <text x="600" y="610" fill="#334155" font-size="13">3 / 4 Consultados</text>
  <text x="760" y="610" fill="#16a34a" font-size="13" font-weight="bold">75.0%</text>
  <rect x="870" y="595" width="90" height="22" rx="11" fill="#f0fdf4"/>
  <text x="888" y="610" fill="#166534" font-size="11" font-weight="bold">Nivel Verde</text>
  <rect x="1010" y="593" width="90" height="26" rx="4" fill="#cbd5e1"/>
  <text x="1025" y="610" fill="#334155" font-size="11">Ver Detalle</text>
